<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop - E-commerce</title>
    <link rel="stylesheet" href="acomers.css">
</head>
<body>

    <!-- Header and Cart Info -->
    <header>
        <div class="logo">🛒 E-Shop</div>
        <div class="cart-info">
            <span>Cart: <strong id="cart-count">0</strong> items</span>
        </div>
    </header>

    <!-- Main Products Section -->
    <main>
        <h2>Our Products</h2>
        <div class="product-grid" id="product-list">
            <!-- Products will be dynamically loaded via JavaScript -->
        </div>
    </main>

    <!-- Cart Summary Section -->
    <section class="cart-section">
        <h2>Shopping Cart Summary</h2>
        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>
        
        <div class="cart-total">
            <h3>Total Price: $<span id="total-price">0</span></h3>
            <button id="checkout-btn" class="btn">Checkout</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 E-Shop. All rights reserved.</p>
    </footer>

    <script src="ecomers.js"></script>
</body>
</html>
